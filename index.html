<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="The Groovin S-election" />
  <meta property="og:description" content="Select your groove" />
  <meta property="og:image" content="https://www.groovinaround.com/logocolor.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:url" content="https://dj.groovinaround.com/" />
  <meta property="og:type" content="website" />
  <title>The Groovin' S-elections</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 { margin-bottom: 5px; text-align: center; font-size: 1.8rem; }
    h2 { color: #aaa; font-weight: normal; margin-bottom: 25px; text-align: center; font-size: 1.2rem; }
    
    .container {
      width: 100%;
      max-width: 450px;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .vote-btn {
      padding: 18px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      transition: transform 0.1s, opacity 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .vote-btn:active { transform: scale(0.98); }

    /* Estils de la Secció de Resultats */
    .results-container {
      display: none;
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .result-row {
      margin-bottom: 15px;
    }
    .label-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .progress-bar-bg {
      background-color: #333;
      height: 22px;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 10px;
    }

    .total-votes {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-top: 15px;
    }
    
    .voted-badge {
      text-align: center;
      color: #eccc68;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎧 GROOVIN' AROUND</h1>
    <h2 id="poll-title">Carregant la pregunta...</h2>

    <!-- SECCIÓ DE BOTONS -->
    <div id="voting-section" class="btn-container">
      <!-- Els botons es generen dinàmicament des de JS -->
    </div>

    <!-- SECCIÓ DE RESULTATS -->
    <div id="results-section" class="results-container">
      <div class="voted-badge">✓ Vot registrat! Resultats en directe:</div>
      <div id="results-list">
        <!-- Les barres de resultats es generen dinàmicament -->
      </div>
      <div class="total-votes" id="total-count">Total de vots: 0</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ⚠️ MANTÉN LES TEVES DADES REALS DE FIREBASE AQUÍ
    const firebaseConfig = {
    apiKey: "AIzaSyDyxTM2WDDmSehjjchRtcWrfVG_aQ1Dg_0",
    authDomain: "groovinpd.firebaseapp.com",
    databaseURL: "https://groovinpd-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "groovinpd",
    storageBucket: "groovinpd.firebasestorage.app",
    messagingSenderId: "621205305903",
    appId: "1:621205305903:web:603a6234295bbf92f7a4da",
    measurementId: "G-P6F9JGEPHF"


    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Paleta de colors atractiva per a fins a 5 opcions
    const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6'];

    let hasVoted = false;
    let currentPollId = "";

    db.ref('votacio_actual').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const options = data.opcions || [];
      const votes = data.vots || [];
      
      // Identificador de la votació actual
      const newPollId = `${data.títol}_${options.join('_')}`;

      if (currentPollId !== newPollId) {
        currentPollId = newPollId;
        hasVoted = localStorage.getItem('voted_poll') === currentPollId;
      }

      document.getElementById('poll-title').innerText = data.títol || 'Tria la música:';

      // Calcular total de vots
      const totalVotes = votes.reduce((a, b) => a + (b || 0), 0);

      // Renderitzar Botons
      const votingSec = document.getElementById('voting-section');
      votingSec.innerHTML = '';
      options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'vote-btn';
        btn.style.backgroundColor = colors[index % colors.length];
        btn.innerText = optText;
        btn.onclick = () => votar(index);
        votingSec.appendChild(btn);
      });

      // Renderitzar Resultats
      const resultsList = document.getElementById('results-list');
      resultsList.innerHTML = '';
      options.forEach((optText, index) => {
        const optVotes = votes[index] || 0;
        const pct = totalVotes > 0 ? Math.round((optVotes / totalVotes) * 100) : 0;

        const row = document.createElement('div');
        row.className = 'result-row';
        row.innerHTML = `
          <div class="label-container">
            <span>${optText}</span>
            <span>${pct}% (${optVotes})</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${pct}%; background-color: ${colors[index % colors.length]}"></div>
          </div>
        `;
        resultsList.appendChild(row);
      });

      document.getElementById('total-count').innerText = `Total de vots registrats: ${totalVotes}`;

      toggleViews();
    });

    function votar(index) {
      db.ref(`votacio_actual/vots/${index}`).transaction((currentVotes) => {
        return (currentVotes || 0) + 1;
      }).then(() => {
        hasVoted = true;
        localStorage.setItem('voted_poll', currentPollId);
        toggleViews();
      });
    }

    function toggleViews() {
      const votingSec = document.getElementById('voting-section');
      const resultsSec = document.getElementById('results-section');

      if (hasVoted) {
        votingSec.style.display = 'none';
        resultsSec.style.display = 'block';
      } else {
        votingSec.style.display = 'flex';
        resultsSec.style.display = 'none';
      }
    }
  </script>
</body>
</html>
