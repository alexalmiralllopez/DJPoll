<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tria la Música - DJ Vote</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 { margin-bottom: 5px; text-align: center; font-size: 1.8rem; }
    h2 { color: #aaa; font-weight: normal; margin-bottom: 25px; text-align: center; font-size: 1.2rem; }
    
    .container {
      width: 100%;
      max-width: 400px;
    }

    /* Estils dels Botons de Votació */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    button {
      padding: 22px;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.98); }
    .btn-a { background-color: #ff4757; color: white; }
    .btn-b { background-color: #2ed573; color: white; }

    /* Estils de la Secció de Resultats */
    .results-container {
      display: none; /* Amagat per defecte */
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .result-row {
      margin-bottom: 15px;
    }
    .label-container {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .progress-bar-bg {
      background-color: #333;
      height: 25px;
      border-radius: 12px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 12px;
    }
    .fill-a { background-color: #ff4757; }
    .fill-b { background-color: #2ed573; }
    
    .total-votes {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-top: 15px;
    }
    
    .voted-badge {
      text-align: center;
      color: #eccc68;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎧 The Groovin Around Afterparty</h1>
    <h2 id="poll-title">Carregant la pregunta...</h2>

    <!-- OPCIÓ 1: BOTO DE VOTACIÓ -->
    <div id="voting-section" class="btn-container">
      <button class="btn-a" id="btn-a" onclick="votar('opcioA')">Opció A</button>
      <button class="btn-b" id="btn-b" onclick="votar('opcioB')">Opció B</button>
    </div>

    <!-- OPCIÓ 2: RESULTATS EN TEMPS REAL (es mostra en votar) -->
    <div id="results-section" class="results-container">
      <div class="voted-badge">✓ Gràcies per votar! Resultats en directe:</div>
      
      <div class="result-row">
        <div class="label-container">
          <span id="res-text-a">Opció A</span>
          <span id="res-pct-a">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="bar-a" class="progress-bar-fill fill-a"></div>
        </div>
      </div>

      <div class="result-row">
        <div class="label-container">
          <span id="res-text-b">Opció B</span>
          <span id="res-pct-b">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="bar-b" class="progress-bar-fill fill-b"></div>
        </div>
      </div>

      <div class="total-votes" id="total-count">Total de vots: 0</div>
    </div>
  </div>

  <!-- Scripts Oficials de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ⚠️ REEMPLAÇA AMB LES TEVES DADES DE FIREBASE
    const firebaseConfig = {
    apiKey: "AIzaSyDyxTM2WDDmSehjjchRtcWrfVG_aQ1Dg_0",
    authDomain: "groovinpd.firebaseapp.com",
    databaseURL: "https://groovinpd-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "groovinpd",
    storageBucket: "groovinpd.firebasestorage.app",
    messagingSenderId: "621205305903",
    appId: "1:621205305903:web:603a6234295bbf92f7a4da",
    measurementId: "G-P6F9JGEPHF"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let hasVoted = false;
    let currentPollId = "";

    // Escolta canvis a la base de dades en TEMPS REAL
    db.ref('votacio_actual').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      // Generem una clave única per saber si el DJ ha canviat la pregunta
      const newPollId = `${data.títol}_${data.textA}_${data.textB}`;

      // Si el DJ ha posat una nova pregunta/cançons, demanem vot de nou
      if (currentPollId !== newPollId) {
        currentPollId = newPollId;
        hasVoted = localStorage.getItem('voted_poll') === currentPollId;
      }

      // Actualitzar Textos
      document.getElementById('poll-title').innerText = data.títol || 'Vota la pròxima cançó:';
      document.getElementById('btn-a').innerText = data.textA || 'Opció A';
      document.getElementById('btn-b').innerText = data.textB || 'Opció B';
      document.getElementById('res-text-a').innerText = data.textA || 'Opció A';
      document.getElementById('res-text-b').innerText = data.textB || 'Opció B';

      // Calcular Percentatges
      const votsA = data.opcioA || 0;
      const votsB = data.opcioB || 0;
      const total = votsA + votsB;

      const pctA = total > 0 ? Math.round((votsA / total) * 100) : 0;
      const pctB = total > 0 ? Math.round((votsB / total) * 100) : 0;

      // Actualitzar la interfície de resultats
      document.getElementById('bar-a').style.width = pctA + '%';
      document.getElementById('bar-b').style.width = pctB + '%';
      document.getElementById('res-pct-a').innerText = `${pctA}% (${votsA})`;
      document.getElementById('res-pct-b').innerText = `${pctB}% (${votsB})`;
      document.getElementById('total-count').innerText = `Total de vots registrats: ${total}`;

      // Decidir quina vista mostrar
      toggleViews();
    });

    // Funció per enviar el vot a Firebase
    function votar(opcio) {
      db.ref('votacio_actual/' + opcio).transaction((currentVotes) => {
        return (currentVotes || 0) + 1;
      }).then(() => {
        hasVoted = true;
        localStorage.setItem('voted_poll', currentPollId); // Guardem que ja ha votat aquesta ronda
        toggleViews();
      });
    }

    // Mostra o amaga els resultats segons si l'usuari ja ha votat
    function toggleViews() {
      const votingSec = document.getElementById('voting-section');
      const resultsSec = document.getElementById('results-section');

      if (hasVoted) {
        votingSec.style.display = 'none';
        resultsSec.style.display = 'block';
      } else {
        votingSec.style.display = 'flex';
        resultsSec.style.display = 'none';
      }
    }
  </script>
</body>
</html>
